name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 18 * * *"   # once a day
  workflow_dispatch:         # allow manual runs
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the cards branch (NOT main). This action always auto-commits its
      # output to whatever branch is checked out, so pointing it here keeps that
      # bot-commit off main. The publish step below then overwrites this branch with
      # the flat, final SVGs.
      - uses: actions/checkout@v4
        with:
          ref: profile-summary-card-output
          fetch-depth: 0

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -7

      # Publish the freshly generated SVGs flat at the branch root (tokyonight/… etc.),
      # replacing the branch — same mechanism snake.yml uses for its output branch.
      - name: Publish cards to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: profile-summary-card-output
          build_dir: profile-summary-card-output
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
